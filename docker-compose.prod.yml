# 운영(해달 서버)용 - 로컬 개발은 기존 docker-compose.yml(DB만) 그대로 사용
#
# 서버 최초 1회:  cp .env.example .env  후 값 채우기
# 실행:          docker compose -f docker-compose.prod.yml up -d --build
# 재배포:        git pull 후 위 명령 다시 실행
# 로그:          docker compose -f docker-compose.prod.yml logs -f app

services:
  app:
    build: .
    container_name: ondal-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
    env_file: .env   # DB_PASSWORD 등 주입 - 주석 처리된 변수는 존재하지 않아 prod 프로필 기본값이 적용됨
    ports:
      - "8080:8080"   # HTTPS 프록시(Caddy) 도입 후 "127.0.0.1:8080:8080"으로 좁힌다
    volumes:
      - ondal-uploads:/app/uploads   # 제출 파일은 컨테이너를 갈아끼워도 보존
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: ondal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ondal
      POSTGRES_USER: ondal
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # ports 없음 - DB는 app 컨테이너의 내부 네트워크에서만 접근, 외부 비공개
    volumes:
      - ondal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ondal -d ondal"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  ondal-db-data:
  ondal-uploads:
